<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,600,1,0"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Quintessential&family=Story+Script&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container">
      <header>
        <div class="search">
          <label for="search" style="height: 24px; width: 24px">
            <span class="material-symbols-outlined"> search </span>
          </label>
          <input id="search" name="search" type="text" />
        </div>
        <div class="profile-section">
          <span class="material-symbols-outlined"> notifications_active </span>
          <span class="material-symbols-outlined"> account_circle </span>
          <p class="story-script-regular">Ezz Maree</p>
        </div>
        <div style="border: 3px solid gray">
          <p>Welcome message</p>
        </div>
        <div class="action-buttons-container">
          <button>New</button>
          <button>Upload</button>
          <button>Share</button>
        </div>
      </header>
      <nav>
        <div class="nav-link">
          <span class="material-symbols-outlined"> dashboard </span>
          <h1>Dashboard</h1>
        </div>
        <div>
          <div class="nav-link">
            <span class="material-symbols-outlined"> home </span>
            <p>Home</p>
          </div>
          <div class="nav-link">
            <span class="material-symbols-outlined"> id_card </span>
            <p>Profile</p>
          </div>
          <div class="nav-link">
            <span class="material-symbols-outlined"> chat_bubble </span>
            <p>Messages</p>
          </div>
          <div class="nav-link">
            <span class="material-symbols-outlined"> history </span>
            <p>History</p>
          </div>
          <div class="nav-link">
            <span class="material-symbols-outlined"> checklist </span>
            <p>Tasks</p>
          </div>
          <div class="nav-link">
            <span class="material-symbols-outlined"> communities </span>
            <p>Communities</p>
          </div>
        </div>
        <div>
          <div class="nav-link">
            <span class="material-symbols-outlined"> settings </span>
            <p>Settings</p>
          </div>
          <div class="nav-link">
            <span class="material-symbols-outlined"> contact_support </span>
            <p>Support</p>
          </div>
          <div class="nav-link">
            <span class="material-symbols-outlined"> shield </span>
            <p>Privacy</p>
          </div>
        </div>
      </nav>
      <main>main</main>
    </div>
  </body>
</html>
